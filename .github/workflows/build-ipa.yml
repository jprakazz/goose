name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios

      - name: Build app (no signing)
        run: |
          xcodebuild \
            -project GooseSwift.xcodeproj \
            -scheme GooseSwift \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/dd/Build/Products/Release-iphoneos/GooseSwift.app Payload/
          zip -qry GooseSwift.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GooseSwift-unsigned-ipa
          path: GooseSwift.ipa
